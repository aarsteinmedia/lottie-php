services:
  visual:
    image: lottie-php-visual
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: >
      sh -lc "if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --prefer-dist; fi && php -S 0.0.0.0:${PORT:-8000} -t visual/public"
    environment:
      - PORT=8000
      - COMPOSER_CACHE_DIR=/tmp/composer-cache
      - COMPOSER_PROCESS_TIMEOUT=600
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - vendor:/app/vendor
      - composer-cache:/tmp/composer-cache
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1:\".(getenv(\"PORT\")?:\"8000\").\"/\")===false);'"]
      interval: 2s
      timeout: 2s
      retries: 30
  php:
    build: .
    volumes:
      - .:/app
    working_dir: /app
    command: vendor/bin/phpunit

volumes:
  vendor:
  composer-cache: